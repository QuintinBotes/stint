<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Webhooks admin</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #15191f; color: #e6e9ee; }
  header { background: #0d1015; color: #fff; padding: 16px 32px; font-weight: 600; border-bottom: 1px solid #262c35; }
  main { padding: 32px; max-width: 900px; }
  .banner { background: #3d3210; border: 1px solid #d4a017; border-radius: 6px; padding: 16px 20px; margin-bottom: 24px; font-weight: 600; color: #ffe8a3; }
  table { border-collapse: collapse; width: 100%; background: #1c2129; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid #2c333d; }
</style>
</head>
<body>
<header>Webhooks admin</header>
<main>
  <div class="banner" role="alert">Too many requests (429). Try again in 60 s.</div>
  <h1>Deliveries</h1>
  <table>
    <tr><th>Endpoint</th><th>Status</th><th>Last attempt</th></tr>
    <tr><td>https://hooks.example.com/orders</td><td>Delivered</td><td>2 min ago</td></tr>
    <tr><td>https://hooks.example.com/refunds</td><td>Rate limited</td><td>just now</td></tr>
  </table>
</main>
</body>
</html>
