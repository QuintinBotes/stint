name: docker
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - package.json
      - bun.lock
      - packages/**
      - apps/**
      - demo/**
      - scripts/docker-smoke.sh
      - .github/workflows/docker.yml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t stint:local .
      - name: The compose file is valid
        run: STINT_REPO="$RUNNER_TEMP" docker compose config --quiet
      - name: "Smoke test: the replay, stint up on a mounted repository, and a clean stop"
        run: bash scripts/docker-smoke.sh stint:local
