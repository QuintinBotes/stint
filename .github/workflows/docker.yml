name: docker
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - package.json
      - bun.lock
      - packages/**
      - apps/**
      - demo/**
      - scripts/docker-smoke.sh
      - .github/workflows/docker.yml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t stint:local .
      - name: The compose file is valid
        run: STINT_REPO="$RUNNER_TEMP" docker compose config --quiet
      - name: "Smoke test: the replay, stint up on a mounted repository, and a clean stop"
        run: bash scripts/docker-smoke.sh stint:local

  publish:
    # on main and on a v* tag, once the smoke test passed: the same Dockerfile, for amd64 and arm64, to the GitHub
    # container registry, with an SBOM and build provenance, signed with Sigstore's keyless signing
    needs: image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: The image name, in the lower case the registry needs
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image by its digest, which covers every tag it was pushed under
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
