name: ci
on:
  push:
    branches: [main]
  pull_request:

# the workflow only reads the repository; a pull request's code gets no write access
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      META_API_KEY: ${{ secrets.META_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          # the commit-message check reads the pushed range and origin/main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run fixture
      - run: bun run typecheck
      - run: bun test
      - run: bun run build:web
      - name: Identity guard over the files (names checked against the keyed list)
        env:
          STINT_GUARD_KEY: ${{ secrets.STINT_GUARD_KEY }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          # GitHub gives no secrets to a pull request from a fork, so names cannot be checked there;
          # say so, check emails and dashes, and a maintainer runs the name check before merging
          if [ -z "$STINT_GUARD_KEY" ] && [ "$FORK" = "true" ]; then
            echo "::warning::Names were not checked: a pull request from a fork gets no STINT_GUARD_KEY. A maintainer runs node scripts/guard-identity.mjs before merging."
            CI= node scripts/guard-identity.mjs
          else
            node scripts/guard-identity.mjs
          fi
      - name: Identity guard over the commit messages of this push or pull request
        if: runner.os == 'Linux'
        env:
          STINT_GUARD_KEY: ${{ secrets.STINT_GUARD_KEY }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ -z "$STINT_GUARD_KEY" ] && [ "$FORK" = "true" ]; then
            echo "::warning::Commit messages were not checked for names: a pull request from a fork gets no STINT_GUARD_KEY."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/main..HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="$SHA^!"
          elif ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # a force push replaced the history, so the old tip is not in the clone and every commit is new
            range="$SHA"
          else
            range="$BEFORE..$SHA"
          fi
          node scripts/guard-identity.mjs --commits "$range"
      - name: "UI tests: the replay, the live flows and accessibility"
        if: runner.os == 'Linux'
        run: |
          cd apps/web && bunx playwright install --with-deps chromium && cd ../..
          bun run test:ui
      - name: Muse Code sandbox dependency
        if: runner.os == 'Linux'
        run: sudo apt-get install -y bubblewrap
      - name: Muse Code CLI (only when META_API_KEY is configured)
        if: env.META_API_KEY != ''
        run: |
          curl -fsSL https://dev.meta.ai/install.sh | sh
          muse --version

  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: From a clean clone, bootstrap and replay the demo without keys in under 90 seconds
        run: |
          start=$(date +%s)
          bash scripts/bootstrap.sh --check-only
          bun install --frozen-lockfile
          bun run fixture
          bun run build:web
          bun packages/cli/bin/stint demo --speed 0 --json | tail -1
          elapsed=$(( $(date +%s) - start ))
          echo "quickstart took ${elapsed}s"
          test "$elapsed" -lt 90
