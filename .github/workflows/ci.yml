name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      META_API_KEY: ${{ secrets.META_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run fixture
      - run: bun run typecheck
      - run: bun test
      - run: bun run build:web
      - run: node scripts/guard-identity.mjs
      - name: "UI tests: the replay, the live flows and accessibility"
        if: runner.os == 'Linux'
        run: |
          cd apps/web && bunx playwright install --with-deps chromium && cd ../..
          bun run test:ui
      - name: Muse Code sandbox dependency
        if: runner.os == 'Linux'
        run: sudo apt-get install -y bubblewrap
      - name: Muse Code CLI (only when META_API_KEY is configured)
        if: env.META_API_KEY != ''
        run: |
          curl -fsSL https://dev.meta.ai/install.sh | sh
          muse --version

  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: From a clean clone, bootstrap and replay the demo without keys in under 90 seconds
        run: |
          start=$(date +%s)
          bash scripts/bootstrap.sh --check-only
          bun install --frozen-lockfile
          bun run fixture
          bun run build:web
          bun packages/cli/bin/stint demo --speed 0 --json | tail -1
          elapsed=$(( $(date +%s) - start ))
          echo "quickstart took ${elapsed}s"
          test "$elapsed" -lt 90
