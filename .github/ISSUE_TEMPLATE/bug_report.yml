name: Bug report
description: Something in Stint does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The commands or clicks, from a fresh `stint demo` or your own repository.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: stint doctor
      description: The output of `stint doctor`. It names keys by their source and never prints a value.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Stint commit, Bun, git, and your operating system.
